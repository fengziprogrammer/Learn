        style='样式名:样式值; 样式名:样式值; ... ...'

        div  块元素
        span 层

     -->

        asdf<span style="color: red;font-weight: bold;">asdf</span>asdfasdf<span style="border: 1px solid blue;width: 100px; height: 100px;">123</span>asdfqwersdfaserasdfasefasdf
    </div>
    <div style="border:5px solid rgb(6, 196, 53);height: 50px;width: 80%;background-color: rgb(189, 148, 231);margin: 0px auto;"></div>
