<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        /* console.log(1/0)
        console.log(1%0) */ // not a number
        /* ==  等同符
            如果两端的数据类型不同 则尝试将两端的数据转换成数字对比
            true > 1
            false > 0
            '1'  > 1
        */
        console.log(1 == 1)
        console.log(1 == '1')
        console.log(true == '1')
        console.log('true' == '1')


        /* === 等值符
            两端的数据类型如果不同, 直接返回false
        */
        console.log(1 === 1)
        console.log(1 === '1')
        console.log(true === '1')
        console.log('true' === '1')

    </script>
</body>
</html>
