<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        /* 
        + 函数没有权限控制符
        + 不用声明函数的返回值类型,需要返回在函数体中直接return即可,也无需void关键字
        + 参数列表中,无需数据类型
        + 调用函数时,实参和形参的个数可以不一致
        + 声明函数时需要用function关键字
        + 函数没有异常列表
        
        */
       /* 语法1 */
       function sum( a,b){
            return a+b
       }
       /* 语法2 */
       var add=function(a,b){
            return a+b
       }
       /* 语法3匿名函数 */
       setTimeout(function (){
            alert("setTimeout invoked")
        },2000)



       //var res =sum(10,20,30,40)
       var res =add(10,20,30,40)
       console.log(res)



    


    </script>
</body>
</html>
