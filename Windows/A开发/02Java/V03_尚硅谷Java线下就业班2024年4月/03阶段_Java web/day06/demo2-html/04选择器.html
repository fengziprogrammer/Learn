<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 元素选择器  根据元素的名字确定样式的作用范围
            语法   元素名 {}
        
        */
        /* button {
            width: 60px;
            height: 40px;
            background-color: rgb(232, 244, 13);
            border: 3px solid rgb(246, 9, 21);
            border-radius: 5px;
            font-family: 隶书;
            font-size: 20px;
            color: rgb(245, 11, 229);
        } */

        /* id选择器 根据元素的id属性值确定样式的作用范围
            元素的id属性值具有唯一性
            语法 #id值 {}
         */

         /* #b7 {
            width: 60px;
            height: 40px;
            background-color: rgb(232, 244, 13);
            border: 3px solid rgb(246, 9, 21);
            border-radius: 5px;
            font-family: 隶书;
            font-size: 20px;
            color: rgb(245, 11, 229);
        } */

        /* class选择器 通过元素的class属性值确定样式的作用范围
            1 class属性的值可以重复
            2 class属性的值可以是多个
            语法 .class值{}

        */

        .redColor {
            
            background-color: rgb(232, 244, 13);
            border: 3px solid rgb(246, 9, 21);
            color: rgb(245, 11, 229);
        } 

        .greenColor {
            background-color: rgb(13, 244, 86);
            border: 3px solid rgb(7, 143, 5);
            color: white;
        } 

        .blueColor {
            width: 60px;
            height: 40px;
            background-color: rgb(64, 119, 247);
            border: 3px solid rgb(35, 69, 240);
            border-radius: 5px;
            font-family: 隶书;
            font-size: 20px;
            color: white;
        } 

        .big {
            width: 60px;
            height: 40px;
            border-radius: 5px;
            font-family: 隶书;
            font-size: 20px;
            
        } 

        .small {
            width: 50px;
            height: 30px;
            border-radius: 3px;
            font-family: 隶书;
            font-size: 15px;
            
        } 

    </style>

</head>
<body>
    <button id="b2" class="greenColor big" >按钮</button>
    <button id="b4" class="redColor small" >按钮</button>
    <button id="b5" class="blueColor big" >按钮</button>
    <button id="b6" class="a" >按钮</button>
    <button id="b7" class="a" >按钮</button>
    <input type="button" value="按钮" />
</body>
</html>
